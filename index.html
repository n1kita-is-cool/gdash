<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Geometry Dash</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        #game-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid #1e293b;
            position: relative;
        }

        canvas, iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        footer {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header>
        <h1>Geometry Dash</h1>
        <p>Use Spacebar, Up Arrow, or Click to Jump!</p>
    </header>

    <div id="game-container">
        <!-- The default local canvas your gdash.js script targets -->
        <canvas id="canvas"></canvas>
    </div>

    <footer id="game-footer">
        Loading Local Asset Build...
    </footer>

    <!-- 1. Try to load your local game script -->
    <script src="gdash.js" id="local-script"></script>

    <!-- 2. Fallback script in case gdash.js fails, crashes, or is missing assets -->
    <script>
        window.addEventListener('load', () => {
            const canvas = document.getElementById('canvas');
            const container = document.getElementById('game-container');
            const footer = document.getElementById('game-footer');
            
            // Check if the canvas failed to initialize or remained completely blank/inactive
            // If gdash.js crashed or threw an error, we inject a stable web frame instead
            setTimeout(() => {
                const ctx = canvas.getContext('2d');
                
                // If your file was missing assets or threw an error, replace it with the backup mirror
                if (!window.gameInitialized && container.contains(canvas)) {
                    console.log("Local script asset mismatch or crash detected. Loading backup web frame...");
                    
                    container.innerHTML = `
                        <iframe 
                            src="https://github.io" 
                            allowfullscreen="true">
                        </iframe>
                    `;
                    footer.innerText = "Running Web Mirror Backup (Local asset error bypass)";
                } else {
                    footer.innerText = "Running Local Offline Asset Build";
                }
            }, 1500); // 1.5-second timeout window to allow the engine to map graphics
        });
    </script>

</body>
</html>
